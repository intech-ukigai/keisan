<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資材発注書</title>
<style>
* { box-sizing:border-box; }
body { font-family:sans-serif; background:#f5f5f5; margin:0; color:#222; }
.header { background:#000; color:#fff; padding:14px 20px; font-size:20px; font-weight:bold; width:100%; }
.container { max-width:500px; margin:20px auto; padding:0 10px 30px; }
.item { background:#fff; padding:12px; margin-bottom:12px; border-radius:10px; }
.label-title { background:#222; color:#fff; padding:6px 10px; border-radius:6px; margin-bottom:10px; font-size:14px; }
select, textarea { width:100%; padding:9px; border:1px solid #bbb; border-radius:5px; font-size:16px; }
textarea { min-height:120px; resize:vertical; }
.material { display:grid; grid-template-columns:24px 1fr 76px; gap:8px; align-items:center; min-height:44px; padding:7px 2px; border-bottom:1px solid #eee; }
.material:last-child { border-bottom:none; }
.material input[type="checkbox"] { width:20px; height:20px; margin:0; accent-color:#4CAF50; cursor:pointer; }
.material label { line-height:1.4; cursor:pointer; }
.quantity { width:100%; padding:7px 4px; border:1px solid #aaa; border-radius:5px; font-size:16px; text-align:center; }
.quantity:disabled { background:#eee; color:#999; }
.quantity-wrap { display:flex; align-items:center; gap:3px; font-size:13px; white-space:nowrap; }
.hint { color:#666; font-size:12px; line-height:1.5; margin:8px 2px 0; }
button { width:100%; padding:12px; margin-top:10px; border:none; border-radius:10px; background:#4CAF50; color:#fff; font-size:16px; cursor:pointer; }
button:hover { background:#409544; }
#copyButton { background:#ff6b6b; }
#copyButton:hover { background:#f45555; }
#result { display:none; white-space:pre-wrap; background:#fff; padding:12px; margin-top:12px; border-radius:10px; overflow-wrap:anywhere; line-height:1.6; }
@media (max-width:390px) { .material { grid-template-columns:22px 1fr 68px; gap:6px; } }
</style>
</head>
<body>
<div class="header">資材発注書</div>
<main class="container">

<section class="item">
  <div class="label-title">発注者</div>
  <select id="staff">
    <option>波多江</option>
    <option>竹井</option>
  </select>
</section>

<section class="item">
  <div class="label-title">必要資材</div>
  <div id="materials"></div>
</section>

<section class="item">
  <div class="label-title">備考</div>
  <textarea id="note" placeholder="前回のクリアファイルが余っている場合等はクリアファイルの必要枚数を教えてください。指定がなかったら申込書と同じ枚数送ります。"></textarea>
  <p class="hint">※入力しなかった場合、発注書の備考欄は空欄になります。</p>
</section>

<button type="button" id="generateButton">生成</button>
<button type="button" id="copyButton">コピー</button>
<div id="result" aria-live="polite"></div>
</main>

<script>
const materialNames = [
  'NURO光（H）カタログ',
  'NURO光（H）申込書',
  'NURO光（H）今後の流れ',
  'NURO光（H）６万円',
  'NURO光（H）２万円',
  'NURO光（H）４万円',
  'NURO光（H）違約金サポート',
  'NURO光（M）カタログ',
  'NURO光（M）申込書',
  'NURO光（M）今後の流れ',
  'お支払方法ご登録のご案内'
];

const materials = document.getElementById('materials');

materialNames.forEach((name, index) => {
  const row = document.createElement('div');
  row.className = 'material';
  row.innerHTML = `
    <input type="checkbox" id="material-${index}" data-name="${name}">
    <label for="material-${index}">${name}</label>
    <span class="quantity-wrap"><input class="quantity" type="number" min="1" step="1" inputmode="numeric" aria-label="${name}の必要枚数" disabled>枚</span>
  `;
  materials.appendChild(row);
});

document.querySelectorAll('.material input[type="checkbox"]').forEach(checkbox => {
  checkbox.addEventListener('change', () => {
    const quantity = checkbox.closest('.material').querySelector('.quantity');
    quantity.disabled = !checkbox.checked;
    if (checkbox.checked) {
      if (!quantity.value || Number(quantity.value) < 1) quantity.value = '1';
      quantity.focus();
      quantity.select();
    } else {
      quantity.value = '';
    }
  });
});

function generate(){
  const selected = Array.from(document.querySelectorAll('.material input[type="checkbox"]:checked'));
  if (selected.length === 0) {
    alert('必要な資材を1つ以上選択してください。');
    return;
  }

  const lines = selected.map(checkbox => {
    const quantityInput = checkbox.closest('.material').querySelector('.quantity');
    const quantity = Math.max(1, Math.floor(Number(quantityInput.value) || 1));
    quantityInput.value = quantity;
    return `・${checkbox.dataset.name}：${quantity}枚`;
  });

  const note = document.getElementById('note').value.trim();
  const text = `【資材発注書】\n発注者：${document.getElementById('staff').value}\n\n【必要資材】\n${lines.join('\n')}\n\n【備考】\n${note}`;

  const result = document.getElementById('result');
  result.textContent = text;
  result.style.display = 'block';
}

async function copyText(){
  const result = document.getElementById('result');
  if (!result.textContent) {
    alert('先に「生成」を押してください。');
    return;
  }
  try {
    await navigator.clipboard.writeText(result.textContent);
    alert('コピーしました。');
  } catch (error) {
    alert('コピーできませんでした。生成結果を選択してコピーしてください。');
  }
}

document.getElementById('generateButton').addEventListener('click', generate);
document.getElementById('copyButton').addEventListener('click', copyText);
</script>
</body>
</html>
